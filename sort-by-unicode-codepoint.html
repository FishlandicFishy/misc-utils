<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Characters by Unicode Codepoint</title>
    <style>
        body {
            font-family: "Pretendard Std Variable", "Inter Alia", "Inter", "FallbackKR", "ScriptwideSansCJK-B", "ScriptwideSansCJK-C", "ScriptwideSansCJK-A", sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
        }
        .textbox, .result {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        .result {
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sort Characters by Unicode Codepoint</h1>
        <input type="text" id="inputText" class="textbox" placeholder="Type something...">
        <div id="sortedText" class="result"></div>
    </div>

    <script>
        function getCodePoints(str) {
            const codePoints = [];
            for (let i = 0; i < str.length; i++) {
                const codePoint = str.codePointAt(i);
                codePoints.push({
                    char: String.fromCodePoint(codePoint),
                    codePoint: codePoint
                });
                // Skip the next index if this is a surrogate pair
                if (codePoint > 0xFFFF) {
                    i++;
                }
            }
            return codePoints;
        }

        function sortCharactersByUnicode(str) {
            const codePoints = getCodePoints(str);
            codePoints.sort((a, b) => a.codePoint - b.codePoint);
            return codePoints.map(item => item.char).join('');
        }

        document.getElementById('inputText').addEventListener('input', function() {
            const input = this.value;
            const sorted = sortCharactersByUnicode(input);
            document.getElementById('sortedText').textContent = sorted;
        });
    </script>
</body>
</html>
